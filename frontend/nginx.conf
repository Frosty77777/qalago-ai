# Serves the built UI and proxies /api to the backend on the internal compose network.
# TLS is terminated in front of this container (see docs/DEPLOYMENT.md).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # Google sign-in uses a popup that must be able to message this window.
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Query strings contain coordinates and search text: do not write them to access logs.
        access_log off;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Behind a TLS-terminating proxy, forward its scheme instead (see docs/DEPLOYMENT.md).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
        try_files $uri /index.html;
    }
}
